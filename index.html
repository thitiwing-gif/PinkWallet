<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pink Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
    <h1>💗 Pink Wallet</h1>
    <p>🟢 โหมดจำลอง</p>
</div>

<div class="card">
    <h3>ยอดเงินคงเหลือ</h3>
    <div class="balance" id="balance">฿10,000.00</div>

<button onclick="toggleBalance()">
👁 ซ่อน/แสดงยอดเงิน
</button>
    <p>🏦 Pink Bank</p>
    <p>123-4-56789-0</p>

    <p>💚 081-234-5678</p>
</div>

<div class="menu">
    <button onclick="deposit()">➕ ฝาก</button>
    <button onclick="withdraw()">➖ ถอน</button>
    <button onclick="transfer()">↗️ โอน</button>
    <button onclick="receive()">📥 รับ</button>
    <button>📱 เติมเงิน</button>
    <button>📷 QR</button>
</div>

<div class="history">
    <h3>ธุรกรรมล่าสุด</h3>
    <ul id="historyList"></ul>
</div>

<div class="bottom">
    <div>🏠<br>Home</div>
    <div>📋<br>รายการ</div>
    <div>📷<br>QR</div>
    <div>⚙️<br>ตั้งค่า</div>
</div>

<script src="script.js"></script>

</body>
</html>
